name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install theos (Linux)
        env:
          # install-sdk reads GITHUB_TOKEN (Bearer) for api.github.com —
          # bla hadi = unauthenticated rate-limit (60/hr) → "request failed?!" exit 8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build package
        run: make clean package

      - name: Upload .deb and .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ff-deb
          path: |
            packages/*.deb
            .theos/obj/ff.dylib
            .theos/obj/debug/ff.dylib
          if-no-files-found: error
